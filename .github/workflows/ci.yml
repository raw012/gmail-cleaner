name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate manifest.json
        run: |
          node -e "
            const manifest = JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'));
            const assert = (cond, msg) => { if (!cond) { console.error('FAIL:', msg); process.exit(1); } };
            assert(manifest.manifest_version === 3, 'Must use Manifest V3');
            assert(manifest.background && manifest.background.service_worker, 'Missing service_worker');
            assert(Array.isArray(manifest.permissions), 'Missing permissions array');
            assert(manifest.action && manifest.action.default_popup, 'Missing default_popup');
            console.log('Manifest OK');
          "
